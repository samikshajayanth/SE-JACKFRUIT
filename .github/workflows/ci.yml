name: StudentRMS Part 3 Verification

on:
  push:
    branches: [ main, master, 'feature/**', 'part3/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify (Linux GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Compile All Targets
        run: |
          make clean
          make all

      - name: Smoke-test first launch and persistence across restart
        run: |
          smoke_dir="$(mktemp -d)"
          (
            cd "$smoke_dir"
            printf 'admin\nadmin123\n12\n' | "$GITHUB_WORKSPACE/studentrms_app" > first_run.log
            test -s students.dat
            printf 'admin\nadmin123\n12\n' | "$GITHUB_WORKSPACE/studentrms_app" > second_run.log
            grep -q "Loaded 6 student record(s) from students.dat" second_run.log

            # Verify the audit-log menu and logout path in a fresh process.
            printf 'admin\nadmin123\n11\n12\n' | "$GITHUB_WORKSPACE/studentrms_app" > audit_menu.log
            grep -q "Security Audit Log" audit_menu.log
            grep -q "SUCCESSFUL_LOGIN" login.log
            grep -q "LOGOUT" login.log
            ! grep -q "admin123" login.log

            # Three invalid credential pairs must lock out before the main menu.
            set +e
            printf 'baduser\nbadpass\nbaduser\nbadpass\nbaduser\nbadpass\n' | "$GITHUB_WORKSPACE/studentrms_app" > lockout.log
            lockout_status=$?
            set -e
            test "$lockout_status" -ne 0
            grep -q "Maximum login attempts exceeded" lockout.log
            ! grep -q "StudentRMS Main Menu" lockout.log
          )

      - name: Run Existing Integrated Verification Suite
        run: ./test_suite

      - name: Run Search and Listing Suite
        run: ./test_search_list

      - name: Run Sprint 2 Regression Suite
        run: ./test_sprint2

      - name: Run Part 3 Robustness Unit Suite
        run: ./test_part3_unit

      - name: Run NFR-001 Performance Benchmark (1000 Records)
        run: ./test_perf

  windows-mingw:
    name: Build & Verify (Windows MinGW)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build and run Windows targets
        shell: msys2 {0}
        run: |
          set -e

          CORE="src/auth.c src/student_mgmt.c src/cgpa.c src/search_list.c src/storage.c src/report.c"

          echo "Building integrated test suite..."
          gcc -Wall -Wextra -std=c11 -Iinclude $CORE tests/test_suite.c -o test_suite.exe

          echo "Building search/list tests..."
          gcc -Wall -Wextra -std=c11 -Iinclude src/search_list.c tests/test_search_list.c -o test_search_list.exe

          echo "Building Sprint 2 tests..."
          gcc -Wall -Wextra -std=c11 -Iinclude $CORE tests/test_sprint2.c -o test_sprint2.exe

          echo "Building Part 3 tests..."
          gcc -Wall -Wextra -std=c11 -Iinclude $CORE tests/test_part3_unit.c -o test_part3_unit.exe

          echo "Building performance benchmark..."
          gcc -Wall -Wextra -std=c11 -Iinclude src/search_list.c tests/test_perf.c -o test_perf.exe

          echo "Building interactive application..."
          gcc -Wall -Wextra -std=c11 -Iinclude $CORE src/main.c -o studentrms.exe

          echo "Running integrated tests..."
          ./test_suite.exe

          echo "Running search/list tests..."
          ./test_search_list.exe

          echo "Running Sprint 2 tests..."
          ./test_sprint2.exe

          echo "Running Part 3 tests..."
          ./test_part3_unit.exe

          echo "Running performance benchmark..."
          ./test_perf.exe

  coverage:
    name: GCC Line and Branch Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Build and Execute Instrumented Test Suites
        run: |
          set -o pipefail
          make coverage 2>&1 | tee coverage.log

      - name: Upload gcov evidence
        uses: actions/upload-artifact@v4
        with:
          name: studentrms-gcov-${{ github.sha }}
          path: |
            coverage.log
            *.gcov
            build/coverage
          if-no-files-found: error
          retention-days: 30
