name: StudentRMS Sprint 2 CI

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify (Linux GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Compile All Targets
        run: make all

      - name: Run Existing Integrated Verification Suite
        run: ./test_suite

      - name: Run Sprint 2 Regression Suite
        run: ./test_sprint2

      - name: Run NFR-001 Performance Benchmark (1000 Records)
        run: ./test_perf
