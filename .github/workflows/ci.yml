name: StudentRMS Sprint 1 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify (Linux GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Compile All Targets
        run: |
          gcc -Wall -Wextra -std=c11 -Iinclude src/auth.c src/student_mgmt.c src/cgpa.c src/search_list.c tests/test_suite.c -o test_suite
          gcc -Wall -Wextra -std=c11 -Iinclude src/search_list.c tests/test_perf.c -o test_perf
          gcc -Wall -Wextra -std=c11 -Iinclude src/auth.c src/student_mgmt.c src/cgpa.c src/search_list.c src/main.c -o studentrms

      - name: Run Integrated Verification Suite (28 Tests)
        run: ./test_suite

      - name: Run NFR-001 Performance Benchmark (1000 Records)
        run: ./test_perf
